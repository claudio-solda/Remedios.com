<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Remédios & Pix</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remédios & Pix">
<style>
  :root{
    --bg:#0f1720;
    --card:#1a2530;
    --accent:#3b82f6;
    --accent-dark:#2563eb;
    --on-accent:#06142e;
    --text:#e6edf3;
    --muted:#8b9bab;
    --danger:#ef4444;
    --warn:#f59e0b;
    --border:#2a3945;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:100px;
  }
  header{
    padding:20px 16px 14px;
    background:linear-gradient(180deg,#131c2e,#0f1720);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:5;
  }
  header h1{
    margin:0;
    font-size:20px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header .sub{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
  }
  .summary{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .summary .box{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
  }
  .summary .box .label{font-size:11px;color:var(--muted);}
  .summary .box .value{font-size:17px;font-weight:700;margin-top:2px;}
  .summary .box.pix .value{color:var(--accent);}

  #list{
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
    line-height:1.6;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px;
    display:flex;
    gap:12px;
  }
  .thumb{
    width:64px;
    height:64px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
    background:#0d1319;
    border:1px solid var(--border);
  }
  .thumb.vazio{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
  }
  .card-info{flex:1;min-width:0;}
  .card-info .farmacia{font-weight:600;font-size:15px;}
  .card-info .data{font-size:12px;color:var(--muted);margin-top:2px;}
  .card-info .meds{
    margin-top:8px;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
    white-space:pre-line;
    overflow-wrap:anywhere;
  }
  .card-info .valores{
    display:flex;
    gap:14px;
    margin-top:8px;
    font-size:13px;
  }
  .card-info .valores span b{display:block;font-size:14px;}
  .card-info .valores .total b{color:var(--text);}
  .card-info .valores .pix b{color:var(--accent);}
  .badge{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    padding:3px 9px;
    border-radius:999px;
    font-weight:600;
  }
  .badge.pago{background:#0d1f3a;border:1px solid #1e3d6b;color:var(--accent);}
  .badge.pend{background:#2a2110;border:1px solid #5a4516;color:var(--warn);}
  .card-actions{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .icon-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0d1319;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
  }
  .icon-btn.share{background:#0d1f3a;border-color:#1e3d6b;color:var(--accent);}
  .icon-btn.del{color:var(--danger);}

  .fab{
    position:fixed;
    bottom:22px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--accent);
    color:var(--on-accent);
    border:none;
    font-size:30px;
    font-weight:300;
    box-shadow:0 6px 18px rgba(59,130,246,.4);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
  }

  .sheet-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:flex-end;
    z-index:20;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--bg);
    width:100%;
    border-radius:20px 20px 0 0;
    padding:18px 18px 26px;
    max-height:90vh;
    overflow-y:auto;
    border-top:1px solid var(--border);
  }
  .sheet h2{margin:0 0 14px;font-size:18px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:11px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
  }
  .field textarea{min-height:110px;resize:vertical;line-height:1.4;}
  .photo-row{display:flex;gap:10px;}
  .photo-btn{
    flex:1;
    padding:14px;
    background:var(--card);
    border:1px dashed var(--border);
    border-radius:12px;
    color:var(--muted);
    text-align:center;
    font-size:13px;
    cursor:pointer;
    display:block;
  }
  #preview, #previewComp{
    width:100%;
    max-height:220px;
    object-fit:contain;
    border-radius:10px;
    margin-top:10px;
    display:none;
    background:#000;
  }
  .link-btn{
    background:transparent;
    border:none;
    color:var(--danger);
    font-size:12px;
    margin-top:6px;
    padding:4px 0;
    cursor:pointer;
    display:none;
  }
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .save-btn{
    width:100%;
    padding:14px;
    background:var(--accent);
    color:var(--on-accent);
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    margin-top:6px;
    cursor:pointer;
  }
  .cancel-btn{
    width:100%;
    padding:12px;
    background:transparent;
    color:var(--muted);
    border:none;
    font-size:14px;
    margin-top:8px;
  }
  .hint{font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:14px;}

  #viewer{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:16px;
    background:rgba(0,0,0,.88);
  }
  #viewer img{
    max-width:100%;
    max-height:82vh;
    border-radius:10px;
    background:#fff;
  }
  #viewer .close-hint{color:var(--muted);font-size:13px;margin-top:12px;}
</style>
</head>
<body>

<header>
  <h1>💊 Remédios & Pix</h1>
  <div class="sub">Notas da farmácia e reembolso da metade</div>
  <div class="summary">
    <div class="box">
      <div class="label">Notas cadastradas</div>
      <div class="value" id="sumCount">0</div>
    </div>
    <div class="box">
      <div class="label">Total gasto</div>
      <div class="value" id="sumTotal">R$ 0,00</div>
    </div>
    <div class="box pix">
      <div class="label">Total Pix (metade)</div>
      <div class="value" id="sumPix">R$ 0,00</div>
    </div>
  </div>
</header>

<div id="list"></div>

<button class="fab" onclick="openSheet()">+</button>

<div class="sheet-overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Nova nota</h2>

    <div class="photo-row">
      <label class="photo-btn" for="fileCam">📷<br>Tirar foto</label>
      <label class="photo-btn" for="fileGal">🖼️<br>Da galeria</label>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="fileGal" accept="image/*" style="display:none">
    <img id="preview">

    <div class="field" style="margin-top:14px;">
      <label>Farmácia / Descrição</label>
      <input type="text" id="fFarmacia" placeholder="Ex: Drogasil">
    </div>

    <div class="field">
      <label>Medicamentos (um por linha)</label>
      <textarea id="fMeds" placeholder="Ex: CeraVe loção facial — R$ 125,99"></textarea>
    </div>

    <div class="row2">
      <div class="field">
        <label>Data</label>
        <input type="date" id="fData">
      </div>
      <div class="field">
        <label>Valor total (R$)</label>
        <input type="number" id="fTotal" step="0.01" inputmode="decimal" placeholder="0,00">
      </div>
    </div>

    <div class="field">
      <label>Valor do Pix (metade — pode ajustar)</label>
      <input type="number" id="fPix" step="0.01" inputmode="decimal" placeholder="0,00">
    </div>
    <div class="hint">Calculado automaticamente como metade do valor total.</div>

    <div class="field">
      <label>Pix pago em (deixe vazio se ainda não pagou)</label>
      <input type="date" id="fPixData">
    </div>

    <div class="field">
      <label>Comprovante do Pix</label>
      <label class="photo-btn" for="fileComp">🧾 Anexar comprovante (galeria)</label>
      <input type="file" id="fileComp" accept="image/*" style="display:none">
      <img id="previewComp">
      <button type="button" class="link-btn" id="btnRemoveComp" onclick="removeComp()">Remover comprovante</button>
    </div>

    <button class="save-btn" onclick="saveNote()">Salvar nota</button>
    <button class="cancel-btn" onclick="closeSheet()">Cancelar</button>
  </div>
</div>

<div class="sheet-overlay" id="viewer" onclick="closeViewer()">
  <img id="viewerImg">
  <div class="close-hint">Toque para fechar</div>
</div>

// Ajustes únicos em notas que já existem no celular (não apagam foto nem nada).
const PATCHES = [
  { id: 'comprovante-drogasil-2026-10-20', noteId: 'seed-2026-09-29-drogasil', set: { comprovante: COMP_DROGASIL_1020 } },
  { id: 'pix-pago-drogasil-2026-10-20', noteId: 'seed-2026-09-29-drogasil', set: { pixPagoEm: '2026-10-20' } }
];

function loadNotes(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch(e){ return []; }
}
function saveNotes(notes){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(notes));
  }catch(e){
    alert('Sem espaço para salvar. Tente reduzir o número de fotos.');
  }
}

function applySeeds(){
  let applied = [];
  try{ applied = JSON.parse(localStorage.getItem(SEED_KEY)) || []; }catch(e){}
  const notes = loadNotes();
  let changed = false;
  SEED_NOTES.forEach(s=>{
    if(!applied.includes(s.id)){
      if(!notes.some(n=>n.id===s.id)) notes.push({...s});
      applied.push(s.id);
      changed = true;
    }
  });
  if(changed){
    saveNotes(notes);
    localStorage.setItem(SEED_KEY, JSON.stringify(applied));
  }
}

function applyPatches(){
  let applied = [];
  try{ applied = JSON.parse(localStorage.getItem(PATCH_KEY)) || []; }catch(e){}
  const notes = loadNotes();
  let changed = false;
  PATCHES.forEach(p=>{
    if(!applied.includes(p.id)){
      const n = notes.find(x=>x.id===p.noteId);
      if(n){
        Object.keys(p.set).forEach(k=>{
          if(n[k] === undefined || n[k] === null || n[k] === '') n[k] = p.set[k];
        });
      }
      applied.push(p.id);
      changed = true;
    }
  });
  if(changed){
    saveNotes(notes);
    localStorage.setItem(PATCH_KEY, JSON.stringify(applied));
  }
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmt(v){
  return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function render(){
  const notes = loadNotes().sort((a,b)=> b.data.localeCompare(a.data));
  const list = document.getElementById('list');
  list.innerHTML = '';

  if(notes.length === 0){
    list.innerHTML = '<div class="empty">Nenhuma nota cadastrada ainda.<br>Toque no + para adicionar a primeira.</div>';
  }

  let total=0, pix=0;
  notes.forEach(n=>{
    total += Number(n.total);
    pix += Number(n.pix);
    const card = document.createElement('div');
    card.className = 'card';
    const thumb = n.foto
      ? `<img class="thumb" src="${n.foto}">`
      : `<div class="thumb vazio">💊</div>`;
    const meds = n.meds ? `<div class="meds">${esc(n.meds)}</div>` : '';
    const badge = n.pixPagoEm
      ? `<div class="badge pago">✔ Pix pago em ${fmtDate(n.pixPagoEm)}</div>`
      : `<div class="badge pend">Pix pendente</div>`;
    const btnComp = n.comprovante
      ? `<button class="icon-btn" onclick="viewComp('${n.id}')">🧾</button>`
      : '';
    card.innerHTML = `
      ${thumb}
      <div class="card-info">
        <div class="farmacia">${esc(n.farmacia) || 'Farmácia'}</div>
        <div class="data">${fmtDate(n.data)}</div>
        ${meds}
        <div class="valores">
          <span class="total">Total<b>${fmt(n.total)}</b></span>
          <span class="pix">Pix<b>${fmt(n.pix)}</b></span>
        </div>
        ${badge}
      </div>
      <div class="card-actions">
        <button class="icon-btn share" onclick="shareNote('${n.id}')">↗</button>
        ${btnComp}
        <button class="icon-btn" onclick="editNote('${n.id}')">✎</button>
        <button class="icon-btn del" onclick="deleteNote('${n.id}')">🗑</button>
      </div>
    `;
    list.appendChild(card);
  });

  document.getElementById('sumCount').textContent = notes.length;
  document.getElementById('sumTotal').textContent = fmt(total);
  document.getElementById('sumPix').textContent = fmt(pix);
}

function showPreview(imgId, src, btnId){
  const el = document.getElementById(imgId);
  if(src){ el.src = src; el.style.display='block'; }
  else { el.style.display='none'; el.removeAttribute('src'); }
  if(btnId) document.getElementById(btnId).style.display = src ? 'block' : 'none';
}

function openSheet(note){
  editingId = note ? note.id : null;
  document.getElementById('sheetTitle').textContent = note ? 'Editar nota' : 'Nova nota';
  document.getElementById('fFarmacia').value = note?.farmacia || '';
  document.getElementById('fMeds').value = note?.meds || '';
  document.getElementById('fData').value = note?.data || new Date().toISOString().slice(0,10);
  document.getElementById('fTotal').value = note?.total || '';
  document.getElementById('fPix').value = note?.pix || '';
  document.getElementById('fPixData').value = note?.pixPagoEm || '';
  currentPhoto = note?.foto || null;
  currentComp = note?.comprovante || null;
  showPreview('preview', currentPhoto);
  showPreview('previewComp', currentComp, 'btnRemoveComp');
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('fileCam').value = '';
  document.getElementById('fileGal').value = '';
  document.getElementById('fileComp').value = '';
}

function resizeImage(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let {width, height} = img;
      if(width > height && width > maxDim){ height = height*maxDim/width; width = maxDim; }
      else if(height > maxDim){ width = width*maxDim/height; height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function setPhoto(file){
  resizeImage(file, 1000, data => {
    currentPhoto = data;
    showPreview('preview', currentPhoto);
  });
}
function setComp(file){
  resizeImage(file, 1400, data => {
    currentComp = data;
    showPreview('previewComp', currentComp, 'btnRemoveComp');
  });
}
function removeComp(){
  currentComp = null;
  document.getElementById('fileComp').value = '';
  showPreview('previewComp', null, 'btnRemoveComp');
}

document.getElementById('fileCam').addEventListener('change', e=>{
  if(e.target.files[0]) setPhoto(e.target.files[0]);
});
document.getElementById('fileGal').addEventListener('change', e=>{
  if(e.target.files[0]) setPhoto(e.target.files[0]);
});
document.getElementById('fileComp').addEventListener('change', e=>{
  if(e.target.files[0]) setComp(e.target.files[0]);
});

document.getElementById('fTotal').addEventListener('input', e=>{
  const v = parseFloat(e.target.value);
  if(!isNaN(v)){
    document.getElementById('fPix').value = (v/2).toFixed(2);
  }
});

function saveNote(){
  const farmacia = document.getElementById('fFarmacia').value.trim();
  const meds = document.getElementById('fMeds').value.trim();
  const data = document.getElementById('fData').value;
  const total = parseFloat(document.getElementById('fTotal').value);
  const pix = parseFloat(document.getElementById('fPix').value);
  const pixPagoEm = document.getElementById('fPixData').value || null;

  if(!data || isNaN(total)){
    alert('Preencha ao menos a data e o valor total.');
    return;
  }

  let notes = loadNotes();
  if(editingId){
    notes = notes.map(n => n.id === editingId
      ? {...n, farmacia, meds, data, total, pix: isNaN(pix)?total/2:pix, foto: currentPhoto, pixPagoEm, comprovante: currentComp}
      : n);
  } else {
    notes.push({
      id: Date.now().toString(),
      farmacia, meds, data, total,
      pix: isNaN(pix) ? total/2 : pix,
      foto: currentPhoto,
      pixPagoEm,
      comprovante: currentComp
    });
  }
  saveNotes(notes);
  closeSheet();
  render();
}

function editNote(id){
  const note = loadNotes().find(n=>n.id===id);
  if(note) openSheet(note);
}

function deleteNote(id){
  if(!confirm('Excluir esta nota?')) return;
  const notes = loadNotes().filter(n=>n.id!==id);
  saveNotes(notes);
  render();
}

function viewComp(id){
  const n = loadNotes().find(x=>x.id===id);
  if(!n || !n.comprovante) return;
  document.getElementById('viewerImg').src = n.comprovante;
  document.getElementById('viewer').classList.add('open');
}
function closeViewer(){
  document.getElementById('viewer').classList.remove('open');
}

async function dataURLtoFile(dataUrl, filename){
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  return new File([blob], filename, {type: blob.type});
}

function noteText(n){
  const meds = n.meds ? `\n${n.meds}` : '';
  const pago = n.pixPagoEm ? `\nPix pago em: ${fmtDate(n.pixPagoEm)}` : '';
  return `💊 ${n.farmacia || 'Farmácia'}\nData: ${fmtDate(n.data)}${meds}\nValor total: ${fmt(n.total)}\nPix (metade): ${fmt(n.pix)}${pago}`;
}

async function shareNote(id){
  const n = loadNotes().find(x=>x.id===id);
  if(!n) return;
  const texto = noteText(n);

  try{
    if((n.foto || n.comprovante) && navigator.canShare){
      const files = [];
      if(n.foto) files.push(await dataURLtoFile(n.foto, 'nota.jpg'));
      if(n.comprovante) files.push(await dataURLtoFile(n.comprovante, 'comprovante-pix.jpg'));
      if(navigator.canShare({files})){
        await navigator.share({ text: texto, files });
        return;
      }
    }
    if(navigator.share){
      await navigator.share({text: texto});
      return;
    }
    await navigator.clipboard.writeText(texto);
    alert('Compartilhamento não suportado — texto copiado para a área de transferência.');
  }catch(e){
    if(e.name !== 'AbortError'){
      console.error(e);
      alert('Não foi possível compartilhar.');
    }
  }
}

applySeeds();
applyPatches();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
